[package]
name = "ome_render"
description = "Renderer for oh_my_engine — sky pass + glTF mesh pass (post-pivot mesh-only)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ome_core.workspace = true
ome_ecs.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
tracing.workspace = true
gltf.workspace = true
image.workspace = true
meshopt.workspace = true
slotmap = "1.0"
# METIS graph partitioning — used by build_meshlets_lod_chain to group
# meshlets by minimising the inter-group shared-vertex edge cut
# (Karis SIGGRAPH 2021 / Ponchio §3.5). `vendored` builds METIS from
# source statically so no system libmetis-devel is required (Bazzite
# atomic compatibility).
metis = { version = "0.2", default-features = false, features = ["vendored"] }

# Material assets are authored as RON. `serde` hooks the derive macros
# the asset uses; both already live in the workspace deps.
ron.workspace = true
serde.workspace = true

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
pollster.workspace = true
