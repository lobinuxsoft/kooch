[package]
name = "ome_bvh"
description = "BVH / spatial-acceleration structure shared by world streaming, physics broadphase, raymarch culling, and frustum/light culling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
glam.workspace = true
bytemuck.workspace = true
wgpu.workspace = true
tracing.workspace = true

[dev-dependencies]
pollster.workspace = true

[features]
# Expose `BvhGpuBuild::block_on` outside the test suite. Off by default
# — `block_on` blocks the calling thread on `device.poll(Wait)`, which
# violates the planet-scale + GPU-driven hot-loop constraint. Tooling
# crates (headless integration tests, offline bake utilities) opt in.
block_on = []
