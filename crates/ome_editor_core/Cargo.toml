[package]
name = "ome_editor_core"
description = "Embedded editor overlay (debug visualization, inspector)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ome_core = { workspace = true, features = ["dynamic"] }
ome_ecs = { workspace = true, features = ["dynamic"] }
ome_render.workspace = true
ome_gizmos.workspace = true
ome_gizmos_handles.workspace = true
# `debug-render` pulls in rapier's world walk, which the viewport overlay
# turns into lines. The editor is the only crate that should ask for it —
# a game build never enables it, so it never compiles it (#558).
ome_physics = { workspace = true, features = ["debug-render"] }
# Authored here, applied in the project's process. The editor needs the
# components to mirror and the gizmos to draw a field that has no mesh.
ome_gravity.workspace = true
ome_window.workspace = true
ome_world.workspace = true
ome_remote.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
egui_dock.workspace = true
exmex.workspace = true
winit.workspace = true
wgpu.workspace = true
tracing.workspace = true
rfd.workspace = true
dirs.workspace = true
serde.workspace = true
ron.workspace = true
sysinfo.workspace = true

[dev-dependencies]
# egui reports unstable widget ids through `log`, and the id-stability
# test reads those complaints rather than reimplementing the check.
log = "0.4"
