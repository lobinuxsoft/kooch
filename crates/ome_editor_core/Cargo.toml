[package]
name = "ome_editor_core"
description = "Embedded editor overlay (debug visualization, inspector)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ome_core.workspace = true
ome_ecs.workspace = true
ome_render.workspace = true
ome_gizmos.workspace = true
ome_gizmos_handles.workspace = true
# `debug-render` pulls in rapier's world walk, which the viewport overlay
# turns into lines. The editor is the only crate that should ask for it —
# a game build never enables it, so it never compiles it (#558).
ome_physics = { workspace = true, features = ["debug-render"] }
ome_window.workspace = true
ome_world.workspace = true
ome_remote.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
egui_dock.workspace = true
winit.workspace = true
wgpu.workspace = true
tracing.workspace = true
rfd.workspace = true
dirs.workspace = true
serde.workspace = true
ron.workspace = true
sysinfo.workspace = true
