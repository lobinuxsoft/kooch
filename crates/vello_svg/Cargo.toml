# In-tree fork of vello_svg 0.11.0 (https://github.com/linebender/vello_svg), Apache-2.0 OR MIT.
# Kept until upstream targets vello 0.11: the published crate builds on vello 0.10 (wgpu 29), which
# cannot share the engine's wgpu 30 device. See KOOCH.md for every change made here.
[package]
name = "vello_svg"
version = "0.11.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/linebender/vello_svg"
description = "An SVG integration for vello (Kóoch fork)"
readme = "README.md"
publish = false

[dependencies]
vello.workspace = true
usvg = { version = "0.49", default-features = false }
kurbo = "0.13.1"
peniko = "0.6.1"
thiserror = "2"

[features]
# Upstream gates its vello sink on this; always on here.
default = ["vello"]
vello = []
