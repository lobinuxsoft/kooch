[package]
name = "kooch_render"
description = "Renderer for kooch — sky pass + glTF mesh pass (post-pivot mesh-only)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kooch_core.workspace = true
kooch_ecs.workspace = true
# Inti — the shading model and its GPU light records. A renderer
# without one paints normals.
kooch_lighting.workspace = true
wgpu.workspace = true
dlss_wgpu = { workspace = true, optional = true }
glam.workspace = true
bytemuck.workspace = true
tracing.workspace = true
# The profiling facade (#785). No backend is selected here: with none
# of `profiling`'s `profile-with-*` features on, every `scope!` in this
# crate expands to nothing, so a release build carries no instrumentation
# at all rather than instrumentation that is switched off (#558).
profiling.workspace = true
gltf.workspace = true
base64.workspace = true
image.workspace = true
meshopt.workspace = true
slotmap = "1.0"
# METIS graph partitioning — used by build_meshlets_lod_chain to group
# meshlets by minimising the inter-group shared-vertex edge cut
# (Karis SIGGRAPH 2021 / Ponchio §3.5). `vendored` builds METIS from
# source statically so no system libmetis-devel is required (Bazzite
# atomic compatibility).
metis = { version = "0.2", default-features = false, features = ["vendored"] }

# Material assets are authored as RON. `serde` hooks the derive macros
# the asset uses; both already live in the workspace deps.
ron.workspace = true
serde.workspace = true

[features]
# Forwards `kooch_core`'s GPU timer scopes (#785). Nothing in this
# crate is `cfg`'d on it: `GpuScopes` is present either way and its
# methods compile to nothing when the feature is off, so the render
# code has one shape.
gpu-profiler = ["kooch_core/gpu-profiler"]
# NVIDIA DLSS (#536). Off by default and compile-time by construction:
# `dlss_wgpu`'s build script links NVIDIA's static library, so a build
# with this on needs `DLSS_SDK` and `VULKAN_SDK` set. With it off the
# `Dlss` technique still exists, still serialises, and falls back to the
# engine's own resolve with a warning.
dlss = ["dep:dlss_wgpu", "kooch_core/dlss"]
# NVIDIA's own debug overlay (Programming Guide 8.2), which draws what
# DLSS actually RECEIVES: the colour it was given, the motion vectors,
# the depth, and a scatter plot of the jitter it has been told about.
#
# 🔴 Links the SDK's DEVELOPMENT library instead of the production one —
# NVIDIA's production blob does not contain the overlay — so a build
# with this on is a debugging build and never a shipped one.
#
# ⚠️ The hotkeys are Ctrl+Alt+F11/F12, which on Linux switch virtual
# terminals. Remap them in `~/ngx/settings.ngxconfig`; see section 8.5.
dlss-debug-overlay = ["dlss", "dlss_wgpu/debug_overlay"]

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
pollster.workspace = true
# Reading back what the GPU scopes reported (#785). Only the test needs
# to name puffin: the engine reaches it through `kooch_core`.
puffin.workspace = true
