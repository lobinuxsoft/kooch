[package]
name = "kooch_render"
description = "Renderer for kooch — sky pass + glTF mesh pass (post-pivot mesh-only)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
kooch_core.workspace = true
kooch_ecs.workspace = true
# Inti — the shading model and its GPU light records. A renderer
# without one paints normals.
kooch_lighting.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
tracing.workspace = true
# The profiling facade (#785). No backend is selected here: with none
# of `profiling`'s `profile-with-*` features on, every `scope!` in this
# crate expands to nothing, so a release build carries no instrumentation
# at all rather than instrumentation that is switched off (#558).
profiling.workspace = true
gltf.workspace = true
base64.workspace = true
image.workspace = true
meshopt.workspace = true
slotmap = "1.0"
# METIS graph partitioning — used by build_meshlets_lod_chain to group
# meshlets by minimising the inter-group shared-vertex edge cut
# (Karis SIGGRAPH 2021 / Ponchio §3.5). `vendored` builds METIS from
# source statically so no system libmetis-devel is required (Bazzite
# atomic compatibility).
metis = { version = "0.2", default-features = false, features = ["vendored"] }

# Material assets are authored as RON. `serde` hooks the derive macros
# the asset uses; both already live in the workspace deps.
ron.workspace = true
serde.workspace = true

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
pollster.workspace = true
