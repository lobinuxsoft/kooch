[package]
name = "kooch_video"
description = "WebM video: AV1 frames decoded on their own thread, played by the clock (#1793)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# AV1 decode: VideoLAN's dav1d (BSD-2) through its maintained bindings, built from source as a
# static library (`SYSTEM_DEPS_DAV1D_BUILD_INTERNAL=always`, set by `.cargo/config.toml` and the
# editor), so nothing ships with a game. Needs `meson`, `ninja` and `nasm` to build.
dav1d = "0.11"
# WebM is Matroska; pure Rust, Zlib/MIT/Apache.
matroska-demuxer = "0.8"
# YUV 4:2:0 to RGBA with SIMD, BSD-3/Apache.
yuv = "0.8"
tracing.workspace = true
