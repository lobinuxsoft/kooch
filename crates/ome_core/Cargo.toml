[package]
name = "ome_core"
description = "Core functionality: App, Plugin system, Schedule, and GPU context"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
encase.workspace = true
glam.workspace = true
pollster.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Asset handles use slotmap (generational arena: dense Vec storage,
# u32 indices, generation counter for stale-handle detection — DOD-friendly).
slotmap = "1.0"

# Dynamic plugin support (optional)
stabby = { workspace = true, features = ["libloading"], optional = true }
libloading = { workspace = true, optional = true }
ome_plugin_api = { workspace = true, optional = true }

[features]
dynamic = ["dep:stabby", "dep:libloading", "dep:ome_plugin_api"]
