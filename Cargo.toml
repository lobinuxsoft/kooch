[workspace]
resolver = "2"
members = [
    "crates/ome_core",
    "crates/ome_ecs",
    "crates/ome_plugin_api",
    "crates/ome_window",
    "crates/ome_input",
    "crates/ome_sdf",
    "crates/ome_lighting",
    "crates/ome_render",
    "crates/ome_physics",
    "crates/ome_gravity",
    "crates/ome_world",
    "crates/ome_audio",
    "crates/ome_scripting",
    "crates/ome_ecs_macros",
    "crates/ome_editor_core",
    "crates/ome_editor",
    "examples/example_plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
repository = "https://github.com/lobinuxsoft/oh_my_engine"
authors = ["lobinuxsoft"]

[workspace.dependencies]
# GPU
wgpu = "23"
# Windowing
winit = "0.30"
# Math
glam = { version = "0.29", features = ["bytemuck", "serde"] }
# Utils
bytemuck = { version = "1.21", features = ["derive"] }
encase = { version = "0.10", features = ["glam"] }
pollster = "0.4"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Window handle
raw-window-handle = "0.6"
# Audio
kira = "0.9"
# Input
gilrs = "0.11"
# Scripting
rhai = "1.21"
# Editor UI
egui = "0.30"
egui-winit = { version = "0.30", default-features = false }
egui-wgpu = "0.30"
egui_dock = "0.15"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
# Serialization
serde = { version = "1", features = ["derive"] }
ron = "0.8"
# File dialogs
rfd = "0.15"
# Dynamic plugins
stabby = "72.1"
libloading = "0.8"

# Internal crates
ome_core = { path = "crates/ome_core" }
ome_ecs = { path = "crates/ome_ecs" }
ome_ecs_macros = { path = "crates/ome_ecs_macros" }
ome_window = { path = "crates/ome_window" }
ome_input = { path = "crates/ome_input" }
ome_sdf = { path = "crates/ome_sdf" }
ome_lighting = { path = "crates/ome_lighting" }
ome_render = { path = "crates/ome_render" }
ome_physics = { path = "crates/ome_physics" }
ome_gravity = { path = "crates/ome_gravity" }
ome_world = { path = "crates/ome_world" }
ome_audio = { path = "crates/ome_audio" }
ome_scripting = { path = "crates/ome_scripting" }
ome_editor_core = { path = "crates/ome_editor_core" }
ome_editor = { path = "crates/ome_editor" }
ome_plugin_api = { path = "crates/ome_plugin_api" }

[package]
name = "oh_my_engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Always present
ome_core.workspace = true
ome_ecs.workspace = true

# Optional (controlled by features)
ome_window = { workspace = true, optional = true }
ome_render = { workspace = true, optional = true }
ome_input = { workspace = true, optional = true }
ome_audio = { workspace = true, optional = true }
ome_sdf = { workspace = true, optional = true }
ome_lighting = { workspace = true, optional = true }
ome_physics = { workspace = true, optional = true }
ome_gravity = { workspace = true, optional = true }
ome_world = { workspace = true, optional = true }
ome_scripting = { workspace = true, optional = true }
ome_editor_core = { workspace = true, optional = true }
ome_editor = { workspace = true, optional = true }
ome_plugin_api = { workspace = true, optional = true }

# External (used by examples)
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
tracing.workspace = true

[features]
default = ["window", "render"]
window = ["dep:ome_window"]
render = ["dep:ome_render", "window"]
input = ["dep:ome_input", "window"]
audio = ["dep:ome_audio"]
sdf = ["dep:ome_sdf"]
lighting = ["dep:ome_lighting"]
physics = ["dep:ome_physics"]
gravity = ["dep:ome_gravity"]
world = ["dep:ome_world"]
scripting = ["dep:ome_scripting"]
editor = ["dep:ome_editor", "dep:ome_editor_core"]
dynamic = ["ome_core/dynamic", "ome_ecs/dynamic", "dep:ome_plugin_api"]

[[example]]
name = "window"
path = "examples/window.rs"
required-features = ["window"]

[[example]]
name = "compute_vector_add"
path = "examples/compute_vector_add.rs"

[[example]]
name = "clear_color"
path = "examples/clear_color.rs"
required-features = ["render"]

[[example]]
name = "editor"
path = "examples/editor.rs"
required-features = ["editor"]

[[example]]
name = "dynamic_plugin"
path = "examples/dynamic_plugin.rs"
required-features = ["dynamic"]
