# Builds the mdBook in docs/book and publishes it to GitHub Pages.
#
# The rendered HTML is gitignored on purpose — a generated artifact in
# the tree is one more thing to forget to regenerate, and the diff of a
# search index tells nobody anything. This workflow is what makes the
# book exist somewhere other than a developer's laptop.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - '.github/workflows/docs.yml'
  # So the book can be republished without a docs commit.
  workflow_dispatch:

# One in flight at a time. A queued run would publish an older tree
# after a newer one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exact versions, and all three of them.
      #
      # The first attempt pinned mdBook to ^0.4 and left the
      # preprocessors unpinned. A preprocessor talks to mdBook over a
      # versioned JSON protocol, so the runner assembled a 0.4 mdBook
      # against preprocessors built for 0.5 and got "Unable to parse the
      # input" — a combination that exists on no developer's machine,
      # which is exactly why a local build passing proved nothing.
      # Pinning one of three is not pinning.
      #
      # Prebuilt binaries rather than `cargo install`: compiling all
      # three from source took minutes per run, on every push that
      # touched a paragraph.
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2,mdbook-mermaid@0.17.0,mdbook-toc@0.15.3

      - name: Report the toolchain it actually got
        run: mdbook --version && mdbook-mermaid --version && mdbook-toc --version

      - name: Build
        run: mdbook build docs/book

      # BEFORE the upload, not after. An upload step handed a missing
      # or empty directory warns and goes green, which publishes an
      # empty site and reports success — the failure mode is a docs
      # build that looks fine and serves nothing.
      - name: Fail if the build produced nothing
        run: test -s docs/book/book/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
