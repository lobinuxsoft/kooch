[package]
name = "example_plugin"
description = "Example dynamic plugin for OhMyEngine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# `dylib`, not `cdylib`: a cdylib exposes a C interface and cannot carry
# Rust types across the boundary. The rlib alongside keeps ordinary
# consumers (tests, other crates) building.
[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
ome_plugin_api.workspace = true
